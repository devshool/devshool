<!-- PARTÍCULA QUE PASSA EMBAIXO -->

<circle
    cx="80"
    cy="255"
    r="3"
    fill="#ff2020"
    filter="url(#glow)">

    <animate
        attributeName="cx"
        values="80;1120;80"
        dur="8s"
        repeatCount="indefinite"
    />

</circle>

</svg>
