</g>

<!-- GLOW EM MOVIMENTO -->

<circle
cx="70"
cy="245"
r="3"
fill="#ff2020"
filter="url(#glow)">

<animate
attributeName="cx"
values="70;1130;70"
dur="7s"
repeatCount="indefinite"/>

</circle>

</svg>
