<svg
    width="1200"
    height="300"
    viewBox="0 0 1200 300"
    xmlns="http://www.w3.org/2000/svg">

<defs>

    <filter id="glow">

        <feGaussianBlur
            stdDeviation="3"
            result="blur"
        />

        <feMerge>

            <feMergeNode in="blur"/>

            <feMergeNode in="SourceGraphic"/>

        </feMerge>

    </filter>


    <linearGradient id="line">

        <stop
            offset="0%"
            stop-color="#ff2020"
            stop-opacity="0"
        />

        <stop
            offset="50%"
            stop-color="#ff2020"
        />

        <stop
            offset="100%"
            stop-color="#ff2020"
            stop-opacity="0"
        />

    </linearGradient>

</defs>


<!-- TÍTULO -->

<rect
    x="405"
    y="20"
    width="390"
    height="60"
    rx="12"
    fill="#000000"
    fill-opacity=".08"
    stroke="#ff2020"
    stroke-width="2"
/>


<text
    x="600"
    y="59"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="700"
    letter-spacing="8"
    fill="#ffffff">

    TECH STACK

</text>


<!-- LINHAS -->

<rect
    x="100"
    y="50"
    width="270"
    height="1"
    fill="url(#line)"
/>

<rect
    x="830"
    y="50"
    width="270"
    height="1"
    fill="url(#line)"
/>


<!-- CARDS -->

<g
    font-family="Arial, Helvetica, sans-serif"
    text-anchor="middle">


