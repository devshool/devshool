<svg
    width="1200"
    height="500"
    viewBox="0 0 1200 500"
    xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#010101"/>
        <stop offset="45%" stop-color="#090303"/>
        <stop offset="100%" stop-color="#010101"/>
    </linearGradient>

    <radialGradient id="redGlow">
        <stop offset="0%" stop-color="#ff2020" stop-opacity=".45"/>
        <stop offset="35%" stop-color="#9d0000" stop-opacity=".18"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line">
        <stop offset="0%" stop-color="#ff2020" stop-opacity="0"/>
        <stop offset="50%" stop-color="#ff3030"/>
        <stop offset="100%" stop-color="#ff2020" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur">
        <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="textGlow">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>

<!-- FUNDO -->

<rect
    width="1200"
    height="500"
    rx="25"
    fill="url(#bg)"
/>

<!-- GLOW CENTRAL -->

<ellipse
    cx="600"
    cy="245"
    rx="400"
    ry="220"
    fill="url(#redGlow)"
    filter="url(#blur)">

    <animate
        attributeName="rx"
        values="350;470;350"
        dur="8s"
        repeatCount="indefinite"/>

    <animate
        attributeName="opacity"
        values=".45;.9;.45"
        dur="6s"
        repeatCount="indefinite"/>

</ellipse>

<!-- GLOW ESQUERDO -->

<circle
    cx="80"
    cy="380"
    r="180"
    fill="url(#redGlow)"
    filter="url(#blur)">

    <animate
        attributeName="cx"
        values="80;270;80"
        dur="12s"
        repeatCount="indefinite"/>

    <animate
        attributeName="cy"
        values="380;100;380"
        dur="10s"
        repeatCount="indefinite"/>

</circle>

<!-- GLOW DIREITO -->

<circle
    cx="1120"
    cy="100"
    r="190"
    fill="url(#redGlow)"
    filter="url(#blur)">

    <animate
        attributeName="cx"
        values="1120;900;1120"
        dur="13s"
        repeatCount="indefinite"/>

    <animate
        attributeName="cy"
        values="100;390;100"
        dur="11s"
        repeatCount="indefinite"/>

</circle>

<!-- GRID -->

<g
    stroke="#ff2020"
    stroke-width=".5"
    opacity=".045">

    <path d="
        M0 100H1200
        M0 200H1200
        M0 300H1200
        M0 400H1200
    "/>

    <path d="
        M100 0V500
        M200 0V500
        M300 0V500
        M400 0V500
        M500 0V500
        M600 0V500
        M700 0V500
        M800 0V500
        M900 0V500
        M1000 0V500
        M1100 0V500
    "/>

</g>

<!-- ÓRBITAS -->

<g
    fill="none"
    stroke="#ff2b2b">

    <ellipse
        cx="600"
        cy="245"
        rx="460"
        ry="145"
        opacity=".1"
        transform="rotate(-7 600 245)"
    />

    <ellipse
        cx="600"
        cy="245"
        rx="520"
        ry="195"
        opacity=".06"
        transform="rotate(8 600 245)"
    />

</g>

<!-- ONDA -->

<path
    fill="none"
    stroke="url(#line)"
    stroke-width="1.4"
    opacity=".45">

    <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"

        values="
        M0 355 C160 260 250 420 410 330 C560 250 680 390 820 315 C970 230 1070 390 1200 310;

        M0 300 C150 400 280 230 420 320 C560 410 700 240 830 330 C970 410 1080 250 1200 345;

        M0 355 C160 260 250 420 410 330 C560 250 680 390 820 315 C970 230 1070 390 1200 310
        "
    />

</path>

<!-- PARTÍCULAS -->

<g fill="#ff3535">

    <circle cx="120" cy="450" r="1.5">
        <animate attributeName="cy" values="500;-20" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="280" cy="470" r="1">
        <animate attributeName="cy" values="500;-20" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="420" cy="490" r="1.8">
        <animate attributeName="cy" values="500;-30" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" dur="6.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="460" r="1.3">
        <animate attributeName="cy" values="500;-20" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;0" dur="8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="920" cy="490" r="1.6">
        <animate attributeName="cy" values="500;-30" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" dur="10s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1080" cy="470" r="1">
        <animate attributeName="cy" values="500;-20" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8;0" dur="7.5s" repeatCount="indefinite"/>
    </circle>

</g>

<!-- TEXTO SUPERIOR -->

<text
    x="600"
    y="145"
    text-anchor="middle"
    fill="#ff3d3d"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    letter-spacing="8">

    DEVELOPER • CREATOR

    <animate
        attributeName="opacity"
        values=".3;1;.3"
        dur="4s"
        repeatCount="indefinite"/>

</text>

<!-- NOME -->

<text
    x="600"
    y="258"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="108"
    font-weight="800"
    letter-spacing="12">

    NSYDEV

</text>

<!-- GLOW DO NOME -->

<text
    x="600"
    y="258"
    text-anchor="middle"
    fill="none"
    stroke="#ff2020"
    stroke-width=".8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="108"
    font-weight="800"
    letter-spacing="12"
    filter="url(#textGlow)">

    NSYDEV

    <animate
        attributeName="opacity"
        values=".15;.55;.15"
        dur="3.2s"
        repeatCount="indefinite"/>

</text>

<!-- SUBTÍTULO -->

<text
    x="600"
    y="305"
    text-anchor="middle"
    fill="#777777"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    letter-spacing="6">

    BUILD • LEARN • CREATE

</text>

<!-- BARRA -->

<rect
    y="342"
    height="1"
    fill="url(#line)">

    <animate
        attributeName="x"
        values="560;450;560"
        dur="4s"
        repeatCount="indefinite"/>

    <animate
        attributeName="width"
        values="80;300;80"
        dur="4s"
        repeatCount="indefinite"/>

</rect>

<!-- URL -->

<text
    x="600"
    y="405"
    text-anchor="middle"
    fill="#555555"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13">

    github.com/notchdev

</text>

<!-- BORDA -->

<rect
    x="200"
    y="498"
    width="800"
    height="1"
    fill="url(#line)"
/>

</svg>
