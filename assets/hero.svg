<svg
    width="1200"
    height="430"
    viewBox="0 0 1200 430"
    xmlns="http://www.w3.org/2000/svg">

<defs>

    <radialGradient id="glow">
        <stop offset="0%" stop-color="#ff2020" stop-opacity=".55"/>
        <stop offset="40%" stop-color="#a00000" stop-opacity=".20"/>
        <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line">
        <stop offset="0%" stop-color="#ff2525" stop-opacity="0"/>
        <stop offset="50%" stop-color="#ff2525"/>
        <stop offset="100%" stop-color="#ff2525" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur">
        <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="textGlow">
        <feGaussianBlur stdDeviation="5" result="blur"/>

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>


<!-- GLOW CENTRAL -->

<ellipse
    cx="600"
    cy="210"
    rx="390"
    ry="170"
    fill="url(#glow)"
    filter="url(#blur)"
    opacity=".45">

    <animate
        attributeName="rx"
        values="330;450;330"
        dur="7s"
        repeatCount="indefinite"
    />

</ellipse>


<!-- ÓRBITAS -->

<g
    fill="none"
    stroke="#ff2626">

    <ellipse
        cx="600"
        cy="210"
        rx="410"
        ry="105"
        opacity=".28"
        stroke-width="1.5">

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="-6 600 210"
            to="354 600 210"
            dur="25s"
            repeatCount="indefinite"
        />

    </ellipse>

    <ellipse
        cx="600"
        cy="210"
        rx="490"
        ry="145"
        opacity=".15"
        stroke-width="1">

        <animateTransform
            attributeName="transform"
            type="rotate"
            from="7 600 210"
            to="-353 600 210"
            dur="32s"
            repeatCount="indefinite"
        />

    </ellipse>

</g>


<!-- ENERGIA ESQUERDA -->

<path
    fill="none"
    stroke="url(#line)"
    stroke-width="3"
    opacity=".8">

    <animate
        attributeName="d"
        dur="6s"
        repeatCount="indefinite"

        values="
        M0 245 C100 140 180 320 310 220 C390 160 410 180 470 215;
        M0 210 C100 300 190 130 320 230 C390 285 430 180 470 215;
        M0 245 C100 140 180 320 310 220 C390 160 410 180 470 215
        "
    />

</path>


<!-- ENERGIA DIREITA -->

<path
    fill="none"
    stroke="url(#line)"
    stroke-width="3"
    opacity=".8">

    <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"

        values="
        M730 215 C800 160 850 310 960 220 C1050 150 1120 280 1200 200;
        M730 215 C820 300 900 130 990 220 C1080 300 1140 140 1200 250;
        M730 215 C800 160 850 310 960 220 C1050 150 1120 280 1200 200
        "
    />

</path>


<!-- PARTÍCULAS -->

<g fill="#ff3030">

    <circle cx="110" cy="330" r="2">
        <animate
            attributeName="cy"
            values="390;30"
            dur="7s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="opacity"
            values="0;1;0"
            dur="7s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="250" cy="370" r="1.4">
        <animate
            attributeName="cy"
            values="410;50"
            dur="10s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="opacity"
            values="0;.8;0"
            dur="10s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="400" cy="350" r="2">
        <animate
            attributeName="cy"
            values="400;40"
            dur="8s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="opacity"
            values="0;.9;0"
            dur="8s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="800" cy="370" r="1.5">
        <animate
            attributeName="cy"
            values="410;60"
            dur="9s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="opacity"
            values="0;.9;0"
            dur="9s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="1010" cy="350" r="2">
        <animate
            attributeName="cy"
            values="400;30"
            dur="7.5s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="opacity"
            values="0;1;0"
            dur="7.5s"
            repeatCount="indefinite"
        />
    </circle>

</g>


<!-- TEXTO SUPERIOR -->

<text
    x="600"
    y="85"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="8"
    fill="#ffffff">

    DEVELOPER • CREATOR

</text>


<!-- NSYDEV -->

<text
    x="600"
    y="230"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="118"
    font-weight="900"
    font-style="italic"
    letter-spacing="-3"
    fill="#ffffff">

    NSYDEV

</text>


<!-- GLOW DO NSYDEV -->

<text
    x="600"
    y="230"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="118"
    font-weight="900"
    font-style="italic"
    letter-spacing="-3"
    fill="none"
    stroke="#ff2020"
    stroke-width="2"
    filter="url(#textGlow)">

    NSYDEV

    <animate
        attributeName="opacity"
        values=".2;.75;.2"
        dur="3s"
        repeatCount="indefinite"
    />

</text>


<!-- SUBTÍTULO -->

<text
    x="600"
    y="285"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="600"
    letter-spacing="8"
    fill="#eeeeee">

    BUILD • LEARN • CREATE

</text>


<!-- LINHA CENTRAL -->

<rect
    y="312"
    height="2"
    fill="url(#line)">

    <animate
        attributeName="x"
        values="550;430;550"
        dur="4s"
        repeatCount="indefinite"
    />

    <animate
        attributeName="width"
        values="100;340;100"
        dur="4s"
        repeatCount="indefinite"
    />

</rect>


<!-- URL -->

<text
    x="600"
    y="355"
    text-anchor="middle"
    font-family="Consolas, monospace"
    font-size="15"
    fill="#aaaaaa">

    github.com/notchdev

</text>


<!-- DETALHES LATERAIS -->

<g
    stroke="#ff2525"
    fill="none"
    opacity=".8">

    <path d="M40 200 L80 160 L135 160"/>
    <path d="M40 200 L80 240 L135 240"/>

    <path d="M1160 200 L1120 160 L1065 160"/>
    <path d="M1160 200 L1120 240 L1065 240"/>

</g>

</svg>
