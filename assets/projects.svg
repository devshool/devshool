<svg
    width="1200"
    height="360"
    viewBox="0 0 1200 360"
    xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="line">
        <stop offset="0%" stop-color="#ff2020" stop-opacity="0"/>
        <stop offset="50%" stop-color="#ff2020"/>
        <stop offset="100%" stop-color="#ff2020" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
        <stop offset="0%" stop-color="#ff2020" stop-opacity=".25"/>
        <stop offset="100%" stop-color="#ff2020" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
        <feGaussianBlur stdDeviation="25"/>
    </filter>

</defs>


<!-- GLOW DISCRETO -->

<ellipse
    cx="600"
    cy="170"
    rx="400"
    ry="130"
    fill="url(#glow)"
    filter="url(#blur)"
    opacity=".25">

    <animate
        attributeName="rx"
        values="330;430;330"
        dur="8s"
        repeatCount="indefinite"
    />

</ellipse>


<!-- TÍTULO -->

<text
    x="600"
    y="65"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="23"
    font-weight="700"
    letter-spacing="9"
    fill="#ffffff">

    REPOSITÓRIOS

</text>


<!-- LINHA DO TÍTULO -->

<rect
    y="88"
    height="2"
    fill="url(#line)">

    <animate
        attributeName="x"
        values="545;430;545"
        dur="4s"
        repeatCount="indefinite"
    />

    <animate
        attributeName="width"
        values="110;340;110"
        dur="4s"
        repeatCount="indefinite"
    />

</rect>


<!-- ÁREA VAZIA -->

<g opacity=".25">

    <path
        d="
        M100 150
        L125 125
        H1075
        L1100 150
        V300
        L1075 325
        H125
        L100 300
        Z"
        fill="#000000"
        fill-opacity=".03"
        stroke="#555555"
        stroke-width="1"
    />

</g>


<!-- PONTOS ANIMADOS DISCRETOS -->

<g fill="#ff2020">

    <circle cx="130" cy="180" r="2">
        <animate
            attributeName="opacity"
            values=".1;.8;.1"
            dur="3s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="1070" cy="290" r="2">
        <animate
            attributeName="opacity"
            values=".8;.1;.8"
            dur="3s"
            repeatCount="indefinite"
        />
    </circle>

</g>

</svg>
