<svg
    width="1200"
    height="390"
    viewBox="0 0 1200 390"
    xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- RECORTE CIRCULAR DA FOTO -->

    <clipPath id="profileClip">

        <circle
            cx="180"
            cy="195"
            r="92"
        />

    </clipPath>


    <!-- GLOW -->

    <radialGradient id="glow">

        <stop
            offset="0%"
            stop-color="#ff2020"
            stop-opacity=".35"
        />

        <stop
            offset="100%"
            stop-color="#ff0000"
            stop-opacity="0"
        />

    </radialGradient>


    <filter id="blur">

        <feGaussianBlur
            stdDeviation="25"
        />

    </filter>

</defs>


<!-- GLOW ATRÁS DA FOTO -->

<circle
    cx="180"
    cy="195"
    r="135"
    fill="url(#glow)"
    filter="url(#blur)"
    opacity=".4">

    <animate
        attributeName="r"
        values="115;145;115"
        dur="6s"
        repeatCount="indefinite"
    />

</circle>


<!-- FOTO -->

<image
    href="IMG_6636.png"
    x="88"
    y="103"
    width="184"
    height="184"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#profileClip)"
/>


<!-- CÍRCULO EXTERNO -->

<circle
    cx="180"
    cy="195"
    r="108"
    fill="none"
    stroke="#ff2020"
    stroke-width="2"
/>


<!-- ANEL ANIMADO -->

<circle
    cx="180"
    cy="195"
    r="118"
    fill="none"
    stroke="#ff2020"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="55 24"
    opacity=".55">

    <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 180 195"
        to="360 180 195"
        dur="12s"
        repeatCount="indefinite"
    />

</circle>


<!-- SOBRE MIM -->

<text
    x="345"
    y="92"
    font-family="Arial, Helvetica, sans-serif"
    font-size="37"
    font-weight="800"
    fill="#ffffff">

    SOBRE MIM

</text>


<!-- LINHA -->

<rect
    x="345"
    y="110"
    width="190"
    height="2"
    fill="#ff2020"
/>


<!-- INFORMAÇÕES -->

<g
    font-family="Consolas, monospace"
    font-size="19">

    <text x="350" y="165">

        <tspan fill="#ff3030">▣</tspan>

        <tspan
            fill="#ffffff"
            font-weight="700">
             OS:
        </tspan>

        <tspan fill="#bbbbbb">
             Windows 10 Pro x64
        </tspan>

    </text>


    <text x="350" y="210">

        <tspan fill="#ff3030">●</tspan>

        <tspan
            fill="#ffffff"
            font-weight="700">
             Pronomes:
        </tspan>

        <tspan fill="#bbbbbb">
             Ele/Dele
        </tspan>

    </text>


    <text x="350" y="255">

        <tspan fill="#ff3030">◆</tspan>

        <tspan
            fill="#ffffff"
            font-weight="700">
             Local:
        </tspan>

        <tspan fill="#bbbbbb">
             Brasil, SP
        </tspan>

    </text>


    <text x="350" y="300">

        <tspan fill="#ff3030">
            &lt;/&gt;
        </tspan>

        <tspan
            fill="#ffffff"
            font-weight="700">
             Learning:
        </tspan>

        <tspan fill="#bbbbbb">
             HTML • CSS
        </tspan>

    </text>

</g>


<!-- DIVISÓRIA CENTRAL -->

<line
    x1="680"
    y1="80"
    x2="680"
    y2="325"
    stroke="#ff2020"
    stroke-width="1"
    opacity=".55">

    <animate
        attributeName="opacity"
        values=".25;.8;.25"
        dur="4s"
        repeatCount="indefinite"
    />

</line>


<!-- STACK / LANGUAGES -->

<text
    x="730"
    y="100"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="17"
    letter-spacing="4"
    fill="#ff3030">

    STACK / LANGUAGES

</text>


<text
    x="730"
    y="155"
    font-family="Consolas, monospace"
    font-size="18"
    fill="#ffffff">

    HTML • CSS • JavaScript

</text>


<text
    x="730"
    y="195"
    font-family="Consolas, monospace"
    font-size="18"
    fill="#ffffff">

    Python • Node.js • Git

</text>


<!-- INTERESTS -->

<text
    x="730"
    y="255"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="17"
    letter-spacing="4"
    fill="#ff3030">

    INTERESTS

</text>


<text
    x="730"
    y="305"
    font-family="Consolas, monospace"
    font-size="17"
    fill="#ffffff">

    Projetos • Programação • Sistemas de jogos

</text>

</svg>
