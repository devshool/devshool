<svg width="1200" height="390"
viewBox="0 0 1200 390"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="border">
<stop offset="0%" stop-color="#ff2020" stop-opacity=".2"/>
<stop offset="50%" stop-color="#ff2020"/>
<stop offset="100%" stop-color="#ff2020" stop-opacity=".2"/>
</linearGradient>

<radialGradient id="glow">
<stop offset="0%" stop-color="#ff2020" stop-opacity=".40"/>
<stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
</radialGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="24"/>
</filter>

</defs>

<!-- GLOW -->

<circle
cx="150"
cy="200"
r="170"
fill="url(#glow)"
filter="url(#blur)"
opacity=".4">

<animate
attributeName="r"
values="130;190;130"
dur="7s"
repeatCount="indefinite"/>

</circle>

<!-- BORDA EXTERNA -->

<path
d="
M30 60
L80 20
H1120
L1170 60
V330
L1130 370
H70
L30 330
Z"
fill="#000000"
fill-opacity=".08"
stroke="url(#border)"
stroke-width="2"/>

<!-- LOGO CIRCULAR -->

<circle
cx="180"
cy="195"
r="120"
fill="#000000"
fill-opacity=".15"
stroke="#ff2020"
stroke-width="2"/>

<circle
cx="180"
cy="195"
r="105"
fill="none"
stroke="#ff2020"
stroke-width="5"
opacity=".35">

<animate
attributeName="stroke-dasharray"
values="10 20;80 10;10 20"
dur="8s"
repeatCount="indefinite"/>

</circle>

<!-- LOGO N -->

<path
d="
M120 245
L155 120
L185 180
L245 120
L215 245
L180 205
Z"
fill="#ffffff"/>

<path
d="
M180 205
L245 120
L215 245
Z"
fill="#ff2020"/>

<!-- SOBRE MIM -->

<text
x="345"
y="95"
font-family="Arial, Helvetica, sans-serif"
font-size="37"
font-weight="800"
fill="#ffffff">

SOBRE MIM

</text>

<rect
x="345"
y="112"
width="190"
height="2"
fill="#ff2020"/>

<!-- INFO -->

<g font-family="Consolas, monospace" font-size="19">

<text x="350" y="165">
<tspan fill="#ff3030">▣</tspan>
<tspan fill="#ffffff">  OS:</tspan>
<tspan fill="#bbbbbb">       Windows 10 Pro x64</tspan>
</text>

<text x="350" y="210">
<tspan fill="#ff3030">●</tspan>
<tspan fill="#ffffff">  Pronomes:</tspan>
<tspan fill="#bbbbbb"> Ele/Dele</tspan>
</text>

<text x="350" y="255">
<tspan fill="#ff3030">◆</tspan>
<tspan fill="#ffffff">  Local:</tspan>
<tspan fill="#bbbbbb">    Brasil, SP</tspan>
</text>

<text x="350" y="300">
<tspan fill="#ff3030">&lt;/&gt;</tspan>
<tspan fill="#ffffff"> Learning:</tspan>
<tspan fill="#bbbbbb"> HTML • CSS</tspan>
</text>

</g>

<!-- DIVISÓRIA -->

<line
x1="680"
y1="80"
x2="680"
y2="325"
stroke="#ff2020"
stroke-width="1"
opacity=".6">

<animate
attributeName="opacity"
values=".2;1;.2"
dur="3s"
repeatCount="indefinite"/>

</line>

<!-- STACK LANG -->

<text
x="730"
y="100"
font-family="Arial"
font-weight="700"
font-size="17"
letter-spacing="4"
fill="#ff3030">

STACK / LANGUAGES

</text>

<text
x="730"
y="155"
font-family="Consolas, monospace"
font-size="18"
fill="#ffffff">

HTML • CSS • JavaScript

</text>

<text
x="730"
y="195"
font-family="Consolas, monospace"
font-size="18"
fill="#ffffff">

Python • Node.js • React

</text>

<!-- INTERESSES -->

<text
x="730"
y="255"
font-family="Arial"
font-weight="700"
font-size="17"
letter-spacing="4"
fill="#ff3030">

INTERESTS

</text>

<text
x="730"
y="305"
font-family="Consolas, monospace"
font-size="17"
fill="#ffffff">

Projetos • Programação • Sistemas de jogos

</text>

<!-- PONTOS -->

<g fill="#ff2020">

<circle cx="700" cy="150" r="2">
<animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
</circle>

<circle cx="1110" cy="320" r="2">
<animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/>
</circle>

</g>

</svg>
